<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart Motion Analysis</title>
  <style>
    :root {
      --bg: #060b14;
      --panel: rgba(10, 18, 34, 0.92);
      --panel-soft: rgba(16, 28, 48, 0.86);
      --surface: #0d1626;
      --ink: #f4f8ff;
      --muted: #9eb0c9;
      --line: rgba(120, 164, 255, 0.16);
      --accent: #2f7df6;
      --accent-2: #63b3ff;
      --danger: #ff453a;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body { height: 100%; }
    html {
      touch-action: manipulation;
    }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(58, 107, 196, 0.22), transparent 28%),
        linear-gradient(180deg, #09111f 0%, #02060d 100%);
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }
    button, input {
      font: inherit;
    }
    .screen {
      display: none;
      min-height: 100vh;
      min-height: 100svh;
      touch-action: manipulation;
    }
    .screen.active {
      display: block;
    }
    .splash {
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .splash-card {
      width: min(430px, 100%);
      text-align: center;
      padding: 52px 28px;
      border-radius: 36px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18, 32, 58, 0.92), rgba(8, 14, 26, 0.94));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    .eyebrow {
      margin-bottom: 14px;
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .splash h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.02;
    }
    .splash p {
      margin: 18px auto 0;
      max-width: 620px;
      font-size: 17px;
      line-height: 1.8;
      color: var(--muted);
    }
    .tap-hint {
      margin-top: 28px;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .shell {
      width: min(430px, calc(100vw - 20px));
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom)) 10px;
    }
    .home-shell {
      width: min(430px, calc(100vw - 20px));
      display: grid;
      gap: 14px;
      min-height: 100vh;
      min-height: 100svh;
      align-content: center;
      justify-content: center;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    .mode-card, .toolbar, .timeline-shell {
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--panel);
      backdrop-filter: blur(18px);
    }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .mode-card {
      padding: 22px 20px;
      background: linear-gradient(180deg, rgba(16, 29, 52, 0.96), rgba(7, 13, 25, 0.96));
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.24);
    }
    .mode-card h3 {
      margin: 0;
      font-size: 24px;
    }
    .mode-card p {
      margin: 10px 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }
    .mode-card strong {
      color: var(--accent);
    }
    .pickers {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .picker-row {
      display: grid;
      gap: 10px;
    }
    .picker-row input[type="file"] {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.03));
      color: var(--ink);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 10px 22px rgba(0, 0, 0, 0.12);
    }
    .picker-row input[type="file"]::file-selector-button {
      border: 0;
      margin-right: 12px;
      padding: 11px 16px;
      border-radius: 999px;
      font-weight: 700;
      color: #f4f8ff;
      background: linear-gradient(180deg, #79b7ff, var(--accent));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        0 10px 18px rgba(47, 125, 246, 0.28);
      cursor: pointer;
    }
    .picker-row input[type="file"]::-webkit-file-upload-button {
      border: 0;
      margin-right: 12px;
      padding: 11px 16px;
      border-radius: 999px;
      font-weight: 700;
      color: #f4f8ff;
      background: linear-gradient(180deg, #79b7ff, var(--accent));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        0 10px 18px rgba(47, 125, 246, 0.28);
      cursor: pointer;
    }
    .cta {
      border: 0;
      border-radius: 999px;
      min-height: 54px;
      padding: 16px 22px;
      cursor: pointer;
      font-weight: 700;
      color: #f4f8ff;
      background: linear-gradient(180deg, #58a2ff, var(--accent));
      box-shadow: 0 12px 26px rgba(47, 125, 246, 0.28);
    }
    .cta.secondary {
      color: #031222;
      background: linear-gradient(180deg, #9bd3ff, var(--accent-2));
    }
    .hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .video-stage {
      width: 100%;
      min-height: 0;
      border-radius: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(10, 16, 28, 0.98), rgba(0, 0, 0, 1));
      border: 1px solid rgba(120, 164, 255, 0.16);
      position: relative;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03),
        0 20px 44px rgba(0, 0, 0, 0.28);
      touch-action: none;
    }
    .single-layout {
      height: clamp(270px, 38svh, 340px);
      min-height: 270px;
    }
    .compare-layout {
      height: clamp(360px, 50svh, 500px);
      min-height: 360px;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
      pointer-events: none;
      -webkit-touch-callout: none;
    }
    video::-webkit-media-controls {
      display: none !important;
      -webkit-appearance: none;
    }
    video::-webkit-media-controls-enclosure {
      display: none !important;
      -webkit-appearance: none;
    }
    video::-webkit-media-controls-panel {
      display: none !important;
      -webkit-appearance: none;
    }
    .stage-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
      background:
        radial-gradient(circle at center, rgba(120,164,255,0.16), transparent 28%),
        linear-gradient(180deg, rgba(18,24,36,0.34), rgba(3,6,12,0.92));
    }
    .toolbar {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(18, 31, 56, 0.9), rgba(8, 14, 26, 0.92));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 16px 34px rgba(0, 0, 0, 0.18);
    }
    .toolbar-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar button {
      border: 0;
      border-radius: 999px;
      min-height: 36px;
      padding: 8px 12px;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      color: var(--ink);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 8px 16px rgba(0, 0, 0, 0.12);
    }
    .speed-row {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      align-items: center;
    }
    .speed-row .speed-button {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .toolbar button.primary {
      background: linear-gradient(180deg, #58a2ff, var(--accent));
      color: #f4f8ff;
      font-weight: 700;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 10px 22px rgba(47, 125, 246, 0.32);
    }
    .toolbar button.active {
      outline: 2px solid rgba(154, 209, 255, 0.85);
      background: linear-gradient(180deg, rgba(99,179,255,0.26), rgba(255,255,255,0.06));
    }
    .timeline-shell {
      padding: 12px 12px 14px;
      background:
        linear-gradient(180deg, rgba(17, 30, 54, 0.94), rgba(5, 10, 20, 0.98)),
        radial-gradient(circle at top, rgba(110, 166, 255, 0.12), transparent 42%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 18px 44px rgba(0, 0, 0, 0.22);
    }
    .big-slider {
      width: 100%;
      height: 18px;
      margin: 0 0 14px;
      -webkit-appearance: none;
      appearance: none;
      background:
        linear-gradient(90deg, rgba(122, 192, 255, 0.98) 0%, rgba(47, 125, 246, 0.98) var(--progress, 0%), rgba(255,255,255,0.12) var(--progress, 0%), rgba(255,255,255,0.12) 100%);
      border-radius: 999px;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 3px rgba(0, 0, 0, 0.28),
        0 8px 22px rgba(0, 0, 0, 0.16);
    }
    .big-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ffffff 0%, #f9fbff 48%, #dfe9f8 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.3),
        0 2px 6px rgba(47, 125, 246, 0.22),
        inset 0 -1px 2px rgba(0, 0, 0, 0.08);
      cursor: pointer;
    }
    .big-slider::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ffffff 0%, #f9fbff 48%, #dfe9f8 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.3),
        0 2px 6px rgba(47, 125, 246, 0.22),
        inset 0 -1px 2px rgba(0, 0, 0, 0.08);
      cursor: pointer;
    }
    .tick-row {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      gap: 6px;
      align-items: end;
      margin-bottom: 12px;
      opacity: 0.72;
    }
    .tick-row span {
      display: block;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
    }
    .tick-row span:nth-child(5n) {
      height: 10px;
      background: rgba(143, 196, 255, 0.65);
    }
    .bottom-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
    }
    .transport {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .transport button, .share-actions button {
      border: 0;
      border-radius: 999px;
      min-height: 44px;
      padding: 10px 14px;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      color: var(--ink);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 10px 18px rgba(0, 0, 0, 0.14);
    }
    .transport button {
      flex: 1 1 0;
      min-width: 0;
    }
    .transport button.primary {
      background: linear-gradient(180deg, #79b7ff, var(--accent));
      color: #f4f8ff;
      font-weight: 700;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.16),
        0 14px 28px rgba(47, 125, 246, 0.36);
    }
    .bottom-back {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-top: 2px;
    }
    .bottom-back button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      min-height: 42px;
      min-width: 112px;
      padding: 8px 18px;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      color: var(--ink);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 10px 18px rgba(0, 0, 0, 0.14);
    }
    .share-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status {
      color: var(--muted);
      font-size: 12px;
    }
    .compare-timelines {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .mini-timeline {
      padding: 12px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.03));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 14px 26px rgba(0, 0, 0, 0.14);
    }
    .mini-timeline-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .mini-slider {
      width: 100%;
      height: 12px;
      margin: 8px 0 10px;
      -webkit-appearance: none;
      appearance: none;
      background:
        linear-gradient(90deg, rgba(157, 214, 255, 0.98) 0%, rgba(99, 179, 255, 0.98) var(--progress, 0%), rgba(255,255,255,0.12) var(--progress, 0%), rgba(255,255,255,0.12) 100%);
      border-radius: 999px;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        inset 0 -1px 2px rgba(0, 0, 0, 0.2);
    }
    .mini-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ffffff 0%, #f8fbff 48%, #dfe9f8 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.28),
        0 1px 4px rgba(99, 179, 255, 0.18);
      cursor: pointer;
    }
    .mini-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ffffff 0%, #f8fbff 48%, #dfe9f8 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.28),
        0 1px 4px rgba(99, 179, 255, 0.18);
      cursor: pointer;
    }
    .mini-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .mini-actions button {
      border: 0;
      border-radius: 999px;
      min-height: 34px;
      padding: 6px 10px;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      color: var(--ink);
      transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }
    .mini-actions button.active-set {
      background: linear-gradient(180deg, #79b7ff, var(--accent));
      color: #f4f8ff;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        0 10px 22px rgba(47, 125, 246, 0.28);
      font-weight: 700;
    }
    .start-tag {
      font-size: 11px;
      color: var(--muted);
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 720px) {
      .compare-timelines {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section id="splashScreen" class="screen active splash">
    <div class="splash-card">
      <div class="eyebrow">Coach Tool</div>
      <h1>Smart Motion Analysis</h1>
      <div class="tap-hint">画面をタップして開始</div>
    </div>
  </section>

  <section id="homeScreen" class="screen">
    <div class="shell home-shell">
      <div class="mode-grid">
        <div class="mode-card">
          <h3>Single Analysis</h3>
          <p>1本の動画を表示したい時に使用します。</p>
          <div class="pickers">
            <div class="picker-row">
              <input id="singleInput" type="file" accept="video/*" />
            </div>
            <button class="cta" id="openSingleButton">単体分析を開く</button>
          </div>
        </div>

        <div class="mode-card">
          <h3>Compare Analysis</h3>
          <p>２本の動画を比較して表示する時に使用します。</p>
          <div class="pickers">
            <div class="picker-row">
              <input id="compareInput" type="file" accept="video/*" multiple />
            </div>
            <button class="cta secondary" id="openCompareButton">比較分析を開く</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="analysisScreen" class="screen">
    <div class="shell">
      <div class="toolbar">
        <div class="speed-row">
          <button class="speed-button active" data-speed="1">1.0x</button>
          <button class="speed-button" data-speed="0.5">0.5x</button>
          <button class="speed-button" data-speed="0.25">0.25x</button>
        </div>
      </div>

      <div id="singleLayout" class="video-stage single-layout">
        <video id="singleVideo" playsinline webkit-playsinline disablepictureinpicture disableremoteplayback></video>
        <div id="singlePlaceholder" class="stage-placeholder">動画が未選択です</div>
      </div>

      <div id="compareLayout" class="compare-layout hidden">
        <div class="video-stage">
          <video id="leftVideo" playsinline webkit-playsinline disablepictureinpicture disableremoteplayback></video>
          <div id="leftPlaceholder" class="stage-placeholder">上動画が未選択です</div>
        </div>
        <div class="video-stage">
          <video id="rightVideo" playsinline webkit-playsinline disablepictureinpicture disableremoteplayback></video>
          <div id="rightPlaceholder" class="stage-placeholder">下動画が未選択です</div>
        </div>
      </div>

      <div class="timeline-shell">
        <input id="timelineSlider" class="big-slider" type="range" min="0" max="1000" value="0" />
        <div id="compareTimelines" class="compare-timelines hidden">
          <div class="mini-timeline">
            <div class="mini-timeline-header">
              <span>上動画</span>
              <span id="leftTimeLabel">0.00 / 0.00</span>
            </div>
            <input id="leftSlider" class="mini-slider" type="range" min="0" max="1000" value="0" />
            <div class="mini-actions">
              <button id="setLeftStartButton">開始位置セット</button>
              <span class="start-tag" id="leftStartLabel">開始位置: 0.00s</span>
            </div>
          </div>
          <div class="mini-timeline">
            <div class="mini-timeline-header">
              <span>下動画</span>
              <span id="rightTimeLabel">0.00 / 0.00</span>
            </div>
            <input id="rightSlider" class="mini-slider" type="range" min="0" max="1000" value="0" />
            <div class="mini-actions">
              <button id="setRightStartButton">開始位置セット</button>
              <span class="start-tag" id="rightStartLabel">開始位置: 0.00s</span>
            </div>
          </div>
        </div>
        <div class="tick-row" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="bottom-actions">
          <div class="transport">
            <button id="stepBackButton">-1コマ</button>
            <button class="primary" id="playButton">同時再生</button>
            <button id="stepForwardButton">+1コマ</button>
          </div>
          <div class="bottom-back">
            <button id="homeButton">ホーム</button>
            <button id="backButton">戻る</button>
          </div>
        </div>
        <div class="status" id="statusText">モードを選んで動画を開いてください。</div>
      </div>

    </div>
  </section>

  <script>
    const splashScreen = document.getElementById("splashScreen");
    const homeScreen = document.getElementById("homeScreen");
    const analysisScreen = document.getElementById("analysisScreen");

    const singleInput = document.getElementById("singleInput");
    const compareInput = document.getElementById("compareInput");
    const openSingleButton = document.getElementById("openSingleButton");
    const openCompareButton = document.getElementById("openCompareButton");
    const homeButton = document.getElementById("homeButton");
    const backButton = document.getElementById("backButton");

    const statusText = document.getElementById("statusText");

    const singleLayout = document.getElementById("singleLayout");
    const compareLayout = document.getElementById("compareLayout");

    const singleVideo = document.getElementById("singleVideo");
    const leftVideo = document.getElementById("leftVideo");
    const rightVideo = document.getElementById("rightVideo");

    const singlePlaceholder = document.getElementById("singlePlaceholder");
    const leftPlaceholder = document.getElementById("leftPlaceholder");
    const rightPlaceholder = document.getElementById("rightPlaceholder");

    const speedButtons = document.querySelectorAll(".speed-button");
    const timelineSlider = document.getElementById("timelineSlider");
    const compareTimelines = document.getElementById("compareTimelines");
    const leftSlider = document.getElementById("leftSlider");
    const rightSlider = document.getElementById("rightSlider");
    const leftTimeLabel = document.getElementById("leftTimeLabel");
    const rightTimeLabel = document.getElementById("rightTimeLabel");
    const setLeftStartButton = document.getElementById("setLeftStartButton");
    const setRightStartButton = document.getElementById("setRightStartButton");
    const leftStartLabel = document.getElementById("leftStartLabel");
    const rightStartLabel = document.getElementById("rightStartLabel");
    const playButton = document.getElementById("playButton");
    const stepBackButton = document.getElementById("stepBackButton");
    const stepForwardButton = document.getElementById("stepForwardButton");

    let currentMode = "single";
    let currentSpeed = 1;
    let compareStartLeft = 0;
    let compareStartRight = 0;
    let isPlaying = false;
    let isRestartingCompareLoop = false;

    function showScreen(target) {
      [splashScreen, homeScreen, analysisScreen].forEach((screen) => {
        if (screen) screen.classList.toggle("active", screen === target);
      });
    }

    function moveToHomeScreen() {
      showScreen(homeScreen);
      splashScreen.remove();
    }

    function setStatus(message) {
      statusText.textContent = message;
    }

    window.setNativeStatus = setStatus;

    ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
      document.addEventListener(eventName, (event) => {
        event.preventDefault();
      }, { passive: false });
    });

    splashScreen.addEventListener("click", moveToHomeScreen, { once: true });
    splashScreen.addEventListener("touchstart", moveToHomeScreen, { once: true });

    function activeVideos() {
      return currentMode === "compare" ? [leftVideo, rightVideo] : [singleVideo];
    }

    function syncSliderFill() {
      timelineSlider.style.setProperty("--progress", `${(Number(timelineSlider.value) / 10)}%`);
    }

    function syncMiniSliderFill(slider) {
      slider.style.setProperty("--progress", `${(Number(slider.value) / 10)}%`);
    }

    function setMode(mode) {
      currentMode = mode;
      const compare = mode === "compare";
      singleLayout.classList.toggle("hidden", compare);
      compareLayout.classList.toggle("hidden", !compare);
      compareTimelines.classList.toggle("hidden", !compare);
      timelineSlider.classList.toggle("hidden", compare);
    }

    function applySpeed(speed) {
      currentSpeed = speed;
      activeVideos().forEach((video) => {
        video.playbackRate = speed;
      });
      speedButtons.forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.speed) === speed);
      });
    }

    function setVideoSource(video, placeholder, file) {
      if (!file) {
        video.removeAttribute("src");
        video.load();
        placeholder.classList.remove("hidden");
        return;
      }
      video.src = URL.createObjectURL(file);
      placeholder.classList.add("hidden");
    }

    function currentReferenceVideo() {
      return currentMode === "compare" ? leftVideo : singleVideo;
    }

    function updateTimelineFromVideo() {
      if (currentMode === "compare") {
        updateCompareTimelines();
        return;
      }
      const ref = currentReferenceVideo();
      const duration = ref.duration || 0;
      const current = ref.currentTime || 0;
      if (!duration) {
        timelineSlider.value = 0;
        syncSliderFill();
        return;
      }
      timelineSlider.value = Math.round((current / duration) * 1000);
      syncSliderFill();
    }

    function updateMiniTimeline(video, slider, label) {
      const duration = video.duration || 0;
      const current = video.currentTime || 0;
      if (!duration) {
        slider.value = 0;
        syncMiniSliderFill(slider);
        label.textContent = "0.00 / 0.00";
        return;
      }
      slider.value = Math.round((current / duration) * 1000);
      syncMiniSliderFill(slider);
      label.textContent = `${current.toFixed(2)} / ${duration.toFixed(2)}`;
    }

    function updateCompareTimelines() {
      updateMiniTimeline(leftVideo, leftSlider, leftTimeLabel);
      updateMiniTimeline(rightVideo, rightSlider, rightTimeLabel);
    }

    function setStartButtonState(button, active) {
      button.classList.toggle("active-set", active);
      button.textContent = active ? "設定済み" : "開始位置セット";
    }

    function seekAll(ratio) {
      activeVideos().forEach((video) => {
        const duration = video.duration || 0;
        if (!duration) return;
        video.pause();
        video.currentTime = duration * ratio;
      });
      updateTimelineFromVideo();
    }

    function seekVideo(video, slider, label, ratio) {
      const duration = video.duration || 0;
      if (!duration) return;
      video.pause();
      video.currentTime = duration * ratio;
      updateMiniTimeline(video, slider, label);
    }

    function stepAll(delta) {
      activeVideos().forEach((video) => {
        const duration = video.duration || 0;
        video.pause();
        video.currentTime = Math.max(0, Math.min(duration, (video.currentTime || 0) + delta));
      });
      updateTimelineFromVideo();
    }

    async function playAll() {
      const videos = activeVideos();
      videos.forEach((video) => {
        video.playbackRate = currentSpeed;
        video.loop = currentMode === "single";
      });

      const results = await Promise.allSettled(
        videos.map((video) => video.play())
      );

      const failed = results.some((result) => result.status === "rejected");
      if (failed) {
        isPlaying = false;
        playButton.textContent = "同時再生";
        setStatus("iPhoneでは比較再生時の音声制約があるため、動画をミュートして再生します。");
        videos.forEach((video) => {
          video.muted = true;
          video.defaultMuted = true;
        });

        const retryResults = await Promise.allSettled(
          videos.map((video) => video.play())
        );
        const retryFailed = retryResults.some((result) => result.status === "rejected");
        if (retryFailed) {
          setStatus("同時再生を開始できませんでした。動画を読み込み直してください。");
          return false;
        }
      }

      isPlaying = true;
      playButton.textContent = "停止";
      return true;
    }

    function pauseAll() {
      activeVideos().forEach((video) => {
        video.pause();
        video.loop = false;
      });
      isPlaying = false;
      isRestartingCompareLoop = false;
      playButton.textContent = "同時再生";
    }

    async function restartCompareLoop() {
      if (!isPlaying || currentMode !== "compare" || isRestartingCompareLoop) return;
      isRestartingCompareLoop = true;
      leftVideo.pause();
      rightVideo.pause();
      leftVideo.currentTime = compareStartLeft;
      rightVideo.currentTime = compareStartRight;
      await playAll();
      isRestartingCompareLoop = false;
    }

    function openSingle() {
      if (!singleInput.files[0]) {
        setStatus("単体分析では動画を1本選んでください。");
        return;
      }
      setMode("single");
      singleVideo.muted = false;
      singleVideo.defaultMuted = false;
      setVideoSource(singleVideo, singlePlaceholder, singleInput.files[0]);
      showScreen(analysisScreen);
      setStatus("単体分析を開きました。");
      applySpeed(currentSpeed);
      updateTimelineFromVideo();
    }

    function openCompare() {
      const files = Array.from(compareInput.files || []);
      if (files.length < 2) {
        setStatus("比較分析では上下2本の動画が必要です。");
        return;
      }
      setMode("compare");
      isRestartingCompareLoop = false;
      leftVideo.muted = true;
      leftVideo.defaultMuted = true;
      rightVideo.muted = true;
      rightVideo.defaultMuted = true;
      setVideoSource(leftVideo, leftPlaceholder, files[0]);
      setVideoSource(rightVideo, rightPlaceholder, files[1]);
      compareStartLeft = 0;
      compareStartRight = 0;
      leftStartLabel.textContent = "開始位置: 0.00s";
      rightStartLabel.textContent = "開始位置: 0.00s";
      setStartButtonState(setLeftStartButton, false);
      setStartButtonState(setRightStartButton, false);
      showScreen(analysisScreen);
      setStatus("比較分析を開きました。");
      applySpeed(currentSpeed);
      updateTimelineFromVideo();
    }

    openSingleButton.addEventListener("click", openSingle);
    openCompareButton.addEventListener("click", openCompare);

    backButton.addEventListener("click", () => {
      pauseAll();
      showScreen(homeScreen);
    });

    homeButton.addEventListener("click", () => {
      pauseAll();
      showScreen(homeScreen);
    });

    speedButtons.forEach((button) => {
      button.addEventListener("click", () => applySpeed(Number(button.dataset.speed)));
    });

    timelineSlider.addEventListener("input", (event) => {
      syncSliderFill();
      seekAll(Number(event.target.value) / 1000);
    });

    leftSlider.addEventListener("input", (event) => {
      syncMiniSliderFill(leftSlider);
      seekVideo(leftVideo, leftSlider, leftTimeLabel, Number(event.target.value) / 1000);
    });

    rightSlider.addEventListener("input", (event) => {
      syncMiniSliderFill(rightSlider);
      seekVideo(rightVideo, rightSlider, rightTimeLabel, Number(event.target.value) / 1000);
    });

    playButton.addEventListener("click", async () => {
      if (isPlaying) {
        pauseAll();
        setStatus("再生を停止しました。");
        return;
      }
      if (currentMode === "compare") {
        leftVideo.currentTime = compareStartLeft;
        rightVideo.currentTime = compareStartRight;
        setStatus("設定した開始位置から同時再生します。");
      } else {
        setStatus("再生を開始しました。");
      }
      await playAll();
    });
    stepBackButton.addEventListener("click", () => stepAll(-1 / 30));
    stepForwardButton.addEventListener("click", () => stepAll(1 / 30));

    setLeftStartButton.addEventListener("click", () => {
      compareStartLeft = leftVideo.currentTime || 0;
      leftStartLabel.textContent = `開始位置: ${compareStartLeft.toFixed(2)}s`;
      setStartButtonState(setLeftStartButton, true);
      setStatus("上動画の開始位置を設定しました。");
      updateCompareTimelines();
    });

    setRightStartButton.addEventListener("click", () => {
      compareStartRight = rightVideo.currentTime || 0;
      rightStartLabel.textContent = `開始位置: ${compareStartRight.toFixed(2)}s`;
      setStartButtonState(setRightStartButton, true);
      setStatus("下動画の開始位置を設定しました。");
      updateCompareTimelines();
    });

    [singleVideo, leftVideo, rightVideo].forEach((video) => {
      video.addEventListener("timeupdate", updateTimelineFromVideo);
      video.addEventListener("loadedmetadata", updateTimelineFromVideo);
    });

    [leftVideo, rightVideo].forEach((video) => {
      video.addEventListener("ended", () => {
        if (currentMode !== "compare" || !isPlaying) return;
        restartCompareLoop();
      });
    });

    syncSliderFill();
    syncMiniSliderFill(leftSlider);
    syncMiniSliderFill(rightSlider);
  </script>
</body>
</html>
